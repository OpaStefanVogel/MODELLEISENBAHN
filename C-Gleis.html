<script>
let R=360;
let d=(Math.sqrt(7)-2)/3*R;
let m077=d;         //=0*R/3+3*d/3=25.830052442583632
let m094=(R-d)/3;   //=1*R/3-1*d/3=
let m172=m094+m077; //=1*R/3+2*d/3=
let m188=2*m094;    //=2*R/3-2*d/3=
let r=1; //Rechtskurve
let l=-1;//Linkskurve
let scale=0.1;
let S={}
S.x=200;
S.y=100;
S.phi=0;
let lfdnr=0;
let Schienen=[];
let Restschienen=[];
let Entfernungen=[];
let zu_entfernen=[];

Logvar(L1,L1);

let st0=`
  <svg id="Grafik" width="2000" height="2000" style="border:solid 1px black" fill="none" stroke="darkgrey">
    <title>SVG C-Gleis</title>
    <defs>
      <g id="Weiche">
        <!--path d="M0,0 l100,0 M0,20 l100,0 M0,0 A200,200 0,0,1 100,26.8 M0,20 A180,180 0,0,1 90,44.12" fill="none" stroke="red"/-->
        <path d="M5,0.2 A200,200 0,0,1 87.178,20 L5,18">
<animate attributeName="d" from="M5,0.2 A200,200 0,0,1 87.178,20 L5,18" to="M4.9,2.2 A200,200 0,0,1 87.178,20 L4.95,20" dur="0.5" fill="freeze" begin="kru.click" end="100"/>
<animate attributeName="d" to="M5,0.2 A200,200 0,0,1 87.178,20 L5,18" from="M4.9,2.2 A200,200 0,0,1 87.178,20 L4.95,20" dur="0.5" fill="freeze" begin="ger.click" end="100"/>
          </path>
        <path d="M100,20 L87.178,20 A200,200 0,0,1 100,26.8" stroke-linejoin="miter" stroke-miterlimit="20" stroke="white" transform="translate(-2,-0.5)"/>
        <path d="M0,0 l100,0 M100,20 L87.178,20 A200,200 0,0,1 100,26.8 M0,20 A180,180 0,0,1 90,44.12" stroke-linejoin="miter" stroke-miterlimit="20"/>
        <circle id="kru" cx="100" cy="-12" r="5" fill="green"/>
        <circle id="ger" cx="90" cy="55" r="5" fill="orange"/>
        </g>
      <g id='Schienenlegezug'>
        <rect x='0' y='-15' width='80' height='30' fill='gray' opacity='0.5'/>
        </g>
      <g id='g188'>
          <rect x='0' y='-5' width='178' height='10' opacity='0.9'/>
        </g>
      <g id='g172'>
        <rect x='0' y='-5' width='160' height='10' opacity='0.9'/>
        </g>
      <g id='k130r'>
        <rect x='0' y='-5' width='178' height='10' opacity='0.9' transform='rotate(14)'/>
        </g>
      <g id='k130l'>
        <rect x='0' y='-5' width='178' height='10' opacity='0.9' transform='rotate(-14)'/>
        </g>
      </defs>
    <use id='Weiche1' href="#Weiche" transform='translate(50,50) rotate(10)'/>
    `;

function Logvar(id,id2) {
  let text='';
  text=text+'R='+R+'<br/>m077='+m077+'<br/>m094='+m094+'<br/>m172='+m172+'<br/>m188='+m188+'<br/>m077+3*m094='+(m077+3*m094);
  text=text+'<br/>S='+JSON.stringify(S);
  text=text+'<br/><br/><br id="br_Schienen"/>Schienen='+JSON.stringify(Schienen);
  text=text+'<br/><br/><br id="br_Restschienen"/>Restschienen='+JSON.stringify(Restschienen);
  text=text+'<br/>Entfernungen=[<br/>'+Entfernungen.join('],<br/>&nbsp;&nbsp;[')+'];<br/>';
  text=text+'<br/>zu_entfernen=<br/>'+zu_entfernen.join('<br/>');
  id2.innerHTML=id.innerHTML;
  id2.scrollTop = id2.scrollHeight;
  id.innerHTML=text;
  id.scrollTop = id.scrollHeight;
  }

function Gerade(Laenge,Bild) {
  S.lfdnr=lfdnr; lfdnr=lfdnr+1;
  S.fun=['Gerade',Laenge,Bild,0,0];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  S.x=S.x+Math.cos(S.phi/180*Math.PI)*Laenge*scale;
  S.y=S.y+Math.sin(S.phi/180*Math.PI)*Laenge*scale;
  }

function Kurve(Radius,Winkel,rl,Bild) {
  S.lfdnr=lfdnr; lfdnr=lfdnr+1;
  S.fun=['Kurve',Radius,Winkel,rl,Bild];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  let phi2=(S.phi+90*rl)/180*Math.PI;
  let phi3=(S.phi+90*rl+Winkel*rl)/180*Math.PI;
  S.x=S.x-Math.cos(phi3)*Radius*scale+Math.cos(phi2)*Radius*scale;
  S.y=S.y-Math.sin(phi3)*Radius*scale+Math.sin(phi2)*Radius*scale;
  S.phi=(S.phi+Winkel*rl+360)%360;
  }


function Schliessen() {
  let S2=[S.x,S.y,S.phi];
  Restschienen=Schienen;
  Schienen=[];
  while (S.phi!=180) if (S.phi<180) Kurve(R,30,r,"#k130r"); else Kurve(R,30,l,"#k130l");
  for (let i=0;i<Restschienen.length;i++) {
    let Q=Restschienen[i].fun;
    if (Q[0]=='Gerade') Gerade(Q[1],Q[2],Q[3],Q[4]); else Kurve(Q[1],Q[2],Q[3],Q[4]);
    }
  while (S.phi!=0) if (S.phi>180) Kurve(R,30,r,"#k130r"); else Kurve(R,30,l,"#k130l");
  Gerade(m188,"#g188");
  let tz=Restschienen;
  Restschienen=Schienen;
  Schienen=tz;
  S.x=S2[0];S.y=S2[1];S.phi=S2[2];
  Logvar(L2,L1);
  Abkuerzen();
  }


let st='';
function Schienenplot() {
  st=st0;
  for (let i=0;i<Schienen.length;i++) {
    let S=Schienen[i];
    st=st+'<use id="Schiene'+i+'" href="'+S.Bild+'" transform="translate('+S.x+','+S.y+') rotate('+S.phi+') scale('+scale+')" fill="green"/>\n  ';
    }
  for (let i=0;i<Restschienen.length;i++) {
    let S=Restschienen[i];
    st=st+'<use id="Schiene'+i+'" href="'+S.Bild+'" transform="translate('+S.x+','+S.y+') rotate('+S.phi+') scale('+scale+')" fill="red"/>\n  ';
    }
  st=st+'<use id="Schienenlegezug1" href="#Schienenlegezug" transform="translate('+S.x+','+S.y+') rotate('+S.phi+')"/>\n  ';

  st=st+'</svg>';
  L3.innerText=st;
  SV.innerHTML=st;
  }

let S1=0;
let S2=0;
function Abkuerzen() {
  let i=0;
  let such=true;
  let weitersuch=true;
  while (such) {//alert(Restschienen.length+'\n'+Restschienen[Restschienen.length-2].Bild);
    such=false;
    weitersuch=true;
    Entfernungen=[];
    for (let i=0;i<Restschienen.length;i++) {
      S1=Restschienen[i];
      for (let j=i+1;j<i+7;j++) if (j<Restschienen.length) {
        S2=Restschienen[j];
        if (S1.phi==S2.phi) {
          let dx=S2.x-S1.x;
          let dy=S2.y-S1.y;
          let ph=S1.phi/180*Math.PI;
          let dxn=Math.round((Math.cos(ph)*dx+Math.sin(ph)*dy)*1000)/1000;
          let dyn=Math.round((-Math.sin(ph)*dx+Math.cos(ph)*dy)*1000)/1000;
          Entfernungen.push([i,j,S1.phi,dxn,dyn]);
          }
        }
      }
    //alert('E '+Entfernungen.length+'\n'+Entfernungen[Entfernungen.length-1]);
    for (let i=0;i<Entfernungen.length;i++) if (weitersuch) {
      let X=Entfernungen[i];
      for (let j=i+1;j<Entfernungen.length;j++) if (weitersuch) {
        let Y=Entfernungen[j];
        if (((X[2]+180)%360==Y[2])&&(Math.abs(X[3]-Y[3])<0.01)&&(Math.abs(X[4]-Y[4])<0.01)) {Loeschen([X,Y,[]]);weitersuch=false;such=true}
        if ((X[2]==Y[2])&&(Math.abs(X[3]-Y[3])<0.01)&&(Math.abs(X[4])>1)&&(Math.abs(X[4]+Y[4])<0.01)) {Loeschen([X,Y,[
          {"x":313.0039370688996,"y":316,"phi":180,"lfdnr":42,"fun":["Gerade",188.33989511483273,"#g188",0,0],"Bild":"#g188"},
          {"x":313.0039370688996,"y":316,"phi":180,"lfdnr":42,"fun":["Gerade",188.33989511483273,"#g188",0,0],"Bild":"#g188"},
          {"x":313.0039370688996,"y":316,"phi":180,"lfdnr":42,"fun":["Gerade",172,"#g172",0,0],"Bild":"#g188"},
          {"x":313.0039370688996,"y":316,"phi":180,"lfdnr":42,"fun":["Gerade",172,"#g172",0,0],"Bild":"#g188"},
          ]]);weitersuch=false;such=true}
        }
      }
    }
  //Logvar(L2);
  }

function Loeschen([X,Y,N]) {//alert('Loeschen mit YX: '+Restschienen.length+' Y='+Y+' X='+X);
  Restschienen.splice(Y[0],Y[1]-Y[0],...N);//alert('ohne Y: '+Restschienen.length);
  Restschienen.splice(X[0],X[1]-X[0],...N);//alert('ohne X: '+Restschienen.length);
  Logvar(L2,L1);
  //Ähnlich zu Schließen:
  let S2=[S.x,S.y,S.phi];
  let Schmerk=Schienen;
  Schienen=[];
  for (let i=0;i<Restschienen.length;i++) {
    let Q=Restschienen[i].fun;
    if (Q[0]=='Gerade') Gerade(Q[1],Q[2],Q[3],Q[4]); else Kurve(Q[1],Q[2],Q[3],Q[4]);
    }
  //Gerade(m188,"#g188");
  Restschienen=Schienen;
  Schienen=Schmerk;
  S.x=S2[0];S.y=S2[1];S.phi=S2[2];
  //alert('loesche X='+X+' und Y='+Y);
  //Schliessen();//=Restschienen neu bestimmen
  }



//Schienenplot();

for (let i=0;i<6;i++) Gerade(m188,"#g188"); Schliessen(); Schienenplot();
for (let i=0;i<6;i++) Kurve(R,30,r,"#k130r");
for (let i=0;i<6;i++) Kurve(R,30,l,"#k130l");
for (let i=0;i<6;i++) Kurve(R,30,r,"#k130r"); Schliessen(); Schienenplot();

  </script>
