function Logvar(id,id2) {
  let text='';
  text=text+'R='+R+'<br/>m077='+m077+'<br/>m094='+m094+'<br/>m172='+m172+'<br/>m188='+m188+'<br/>m077+3*m094='+(m077+3*m094);

  text=text+'<br/><br/><br id="br_Restschienen"/>Restschienen='+JSON.stringify(Restschienen);
  text=text+'<br/><br/><br id="br_Distanzmerkliste"/>Distanzmerkliste=[<br/>\n&nbsp;&nbsp;'+Distanzmerkliste.join(',<br/>\n&nbsp;&nbsp;')+'];<br/>\n';
  text=text+'S.dmlx=['+S.dmlx+'];<br/>\n';
  text=text+'S.dmly=['+S.dmly+'];<br/>\n';
  text=text+'S.dmlx=0';

    if (S.dmlx[i]<0) text=text+'-'; else text=text+'+';
    text=text+Math.abs(S.dmlx[i])+'*'+([0,18,19,17,13,5,16,9,14,8])[i];

  text=text+'S.dmly=0';

    if (S.dmly[i]<0) text=text+'-'; else text=text+'+';
    text=text+Math.abs(S.dmly[i])+'*'+([0,18,19,17,13,5,16,9,14,8])[i];
    }
  text=text+';<br/>\n';

function Gerade(Bild,Laenge) {
  S.lfdnr=lfdnr; lfdnr=lfdnr+1;
  S.fun=['Gerade',Bild,Laenge,0,0];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  let dx=Math.cos(S.phi/180*Math.PI)*Laenge*scale;
  let dy=Math.sin(S.phi/180*Math.PI)*Laenge*scale;
  let dxi=Distanz(dx);
  let dyi=Distanz(dy);
  if (dx<0) S.dmlx[dxi]=S.dmlx[dxi]-1; else S.dmlx[dxi]=S.dmlx[dxi]+1;
  if (dy<0) S.dmly[dyi]=S.dmly[dyi]-1; else S.dmly[dyi]=S.dmly[dyi]+1;
  Distanzsumme(S.dmlx);
  Distanzsumme(S.dmly);
  S.x=S.x+dx;
  S.y=S.y+dy;
  }

function Kurve(Bild,Radius,Winkel,rl) {
  S.lfdnr=lfdnr; lfdnr=lfdnr+1;
  S.fun=['Kurve',Bild,Radius,Winkel,rl];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  let phi2=(S.phi+90*rl)/180*Math.PI;
  let phi3=(S.phi+90*rl+Winkel*rl)/180*Math.PI;
  let dx=-Math.cos(phi3)*Radius*scale+Math.cos(phi2)*Radius*scale;
  let dy=-Math.sin(phi3)*Radius*scale+Math.sin(phi2)*Radius*scale;
  let dxi=Distanz(dx);
  let dyi=Distanz(dy);
  if (dx<0) S.dmlx[dxi]=S.dmlx[dxi]-1; else S.dmlx[dxi]=S.dmlx[dxi]+1;
  if (dy<0) S.dmly[dyi]=S.dmly[dyi]-1; else S.dmly[dyi]=S.dmly[dyi]+1;
  Distanzsumme(S.dmlx);
  Distanzsumme(S.dmly);
  S.x=S.x+dx;
  S.y=S.y+dy;
  if (rl==1) Kurvenliste_r.push('r'+S.phi); else Kurvenliste_l.push('l'+S.phi); 
  S.phi=(S.phi+Winkel*rl+360)%360;
  }

let st='';
function Schienenplot() {
  st=st0;

  for (let i=0;i<Schienen.length;i++) {
    let S=Schienen[i];
    //Schienenliste=Schienenliste+S.fun[0]+"('"+S.fun[1]+"',"+S.fun[2]+','+S.fun[3]+','+S.fun[4]+');'+'\n';

    st=st+'<use id="Schiene'+i+'" href="'+S.Bild+'" transform="translate('+S.x+','+S.y+') rotate('+S.phi+') scale('+scale+')" stroke="green" stroke-width="30"/>\n  ';
    }
  for (let i=0;i<Restschienen.length;i++) {
    let S=Restschienen[i];
    st=st+'<use id="Restschiene'+i+'" href="'+S.Bild+'" transform="translate('+S.x+','+S.y+') rotate('+S.phi+') scale('+scale+')" stroke="red" stroke-width="30" opacity="0.1"/>\n  ';
    }
  st=st+'<use id="Schienenlegezug1" href="#Schienenlegezug" transform="translate('+S.x+','+S.y+') rotate('+S.phi+')"/>\n  ';

  st=st+'';
  L3.innerText=st;
  content.innerHTML=st;
  L4.innerHTML=Schienenliste;
  }

function m188m172such(d) {
  let i0=0;
  let j0=0;
  for (let i=-20;i<20;i++) for (let j=-20;j<20;j++) if (Math.abs((i*m188+j*m172)*scale-d)<0.01) {i0=i; j0=j};
  return [i0,j0];
  }

function Distanz(d) {
  let da=Math.abs(d);
  let i0=-1;
  for (let i=0;i<Distanzmerkliste.length;i++) if (Math.abs(Distanzmerkliste[i]-da)<0.01) i0=i;
  if (i0==-1) {i0=Distanzmerkliste.length; Distanzmerkliste.push(da)}
  return i0;
  }

function Distanzsumme(dl) {
  while (dl[7]>1) {dl[7]=dl[7]-2; dl[2]=dl[2]+1};
  while (dl[7]<-1) {dl[7]=dl[7]+2; dl[2]=dl[2]-1};
  while (dl[9]>1) {dl[9]=dl[9]-2; dl[3]=dl[3]+1};
  while (dl[9]<-1) {dl[9]=dl[9]+2; dl[3]=dl[3]-1};
  while (dl[2]>0&&dl[3]>0) {dl[2]=dl[2]-1; dl[3]=dl[3]-1; dl[1]=dl[1]+2}
  while (dl[2]<0&&dl[3]<0) {dl[2]=dl[2]+1; dl[3]=dl[3]+1; dl[1]=dl[1]-2}
  while (dl[4]>0&&dl[5]>0) {dl[4]=dl[4]-1; dl[5]=dl[5]-1; dl[1]=dl[1]+1}
  while (dl[4]<0&&dl[5]<0) {dl[4]=dl[4]+1; dl[5]=dl[5]+1; dl[1]=dl[1]-1}
  while (dl[7]>0&&dl[9]>0) {dl[7]=dl[7]-1; dl[9]=dl[9]-1; dl[1]=dl[1]+1}
  while (dl[7]<0&&dl[9]<0) {dl[7]=dl[7]+1; dl[9]=dl[9]+1; dl[1]=dl[1]-1}
  
  }

function Los() {

  D=[]; for (var j=0;j<n;j++) D[j]=j;

function tausche(r,s) {
  //alert("[ ["+Ausgangsmatrix.join("],\n  [")+"] ] / "+gemeinsamer_Nenner);  
  m=Ausgangsmatrix.length;
  n=Ausgangsmatrix[0].length;
  //alert(m+" "+n);
  var neueMatrix=[];
  var neuerNenner=Ausgangsmatrix[r][s];
  for (var i=0;i<m;i++) {
    neueMatrix[i]=[];
    for (var j=0;j<n;j++) {
      if (i==r&&j==s) neueMatrix[i][j]=gemeinsamer_Nenner;
      if (i!=r&&j==s) neueMatrix[i][j]=Ausgangsmatrix[i][j];
      if (i==r&&j!=s) neueMatrix[i][j]=-Ausgangsmatrix[i][j];
      if (i!=r&&j!=s) neueMatrix[i][j]=(Ausgangsmatrix[i][j]*neuerNenner-Ausgangsmatrix[i][s]*Ausgangsmatrix[r][j])/gemeinsamer_Nenner;
      }
    }
  if (neuerNenner<0) {
    for (var i=0;i<m;i++) for (var j=0;j<n;j++) neueMatrix[i][j]=-neueMatrix[i][j];
    neuerNenner=-neuerNenner;
    }
  Ausgangsmatrix=neueMatrix;
  gemeinsamer_Nenner=neuerNenner;
  //alert("r="+r+"; s="+s+";\n\n[ ["+Ausgangsmatrix.join("],\n  [")+"] ] / "+gemeinsamer_Nenner);
  }

function t(r,s) {
  hist.push([r,s]);
  p=[r,s,r,s];
  var merk=B[p[2]];
  B[p[2]]=D[p[3]];
  D[p[3]]=merk;
  tausche(p[2],p[3]);
  p=suche_Pivot();
  //alert("p="+p+"\nr="+xy(p[0])+"; s="+xy(p[1])+";\n\n[ ["+Ausgangsmatrix.join("],\n  [")+"] ] / "+gemeinsamer_Nenner);
  Ausgabe();
  }

function Ausgabe() {
  LCode="D=["+D+"];\nB=["+B+"];\np=["+[neu(p[0]),neu(p[1]),p[2],p[3],p[4]]+"];\n-------\n"+LCode;
  HCode=Ausgabe_HCode(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
  document.getElementById("Logfile").firstChild.nodeValue=LCode;
  document.getElementById("HCode").innerHTML=HCode;  
  }

function alt(bi) { if (bi<0) return n-bi-2; else return bi; }
function neu(bi) { if (bi<n) return bi; else return n-bi-2; }
function xy(bi) { if (bi<n) return "x"+bi; else if (bi<n+m-1) return "y"+(bi-n+1); else return 0;}

function suche_Pivot() {
  var r=m+n-1; 
  var s=r;
  var v=0;
  var ri=0;
  var sj=0;
  for (var i=1;i<m;i++) if (Ausgangsmatrix[i][0]<0&&alt(B[i])<r) {r=alt(B[i]); ri=i; v=1}
  for (var j=1;j<n;j++) if (Ausgangsmatrix[0][j]>0&&alt(D[j])<s) {s=alt(D[j]); sj=j; v=2}
  if (r<s) {
    s=m+n-1; sj=0;
    for (var j=1;j<n;j++) if (Ausgangsmatrix[ri][j]>0&&alt(D[j])<s) {s=alt(D[j]); sj=j; v=3}
    } else {
      r=m+n-1; ri=0;
      for (var i=1;i<m;i++) if (Ausgangsmatrix[i][sj]<0&&alt(B[i])<r) {r=alt(B[i]); ri=i; v=4}  
      }
  //alert("suche_Pivot()\n\n[ ["+Ausgangsmatrix.join("],\n  [")+"] ] / "+gemeinsamer_Nenner+"\n\nr="+r+"; s="+s+"; ri="+ri+"; sj="+sj+";\n");
  //alert([r,s,ri,sj]);
  return [r,s,ri,sj,v];
  }

function starte_Pivotverfahren() {
  m=Ausgangsmatrix.length;
  n=Ausgangsmatrix[0].length;
  D=[0]; for (var j=1;j<n;j++) D[j]=j;
  B=[0]; for (var i=1;i<m;i++) B[i]=n+i-1;
  p=suche_Pivot();
  LCode="Ausgangsmatrix und Ergebnis der ersten Pivotsuche:\n\n[ ["+Ausgabe_Logfile(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
  HCode="<p>Ausgangsmatrix und Ergebnis der ersten Pivotsuche:<p>"+Ausgabe_HCode(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
  while (p[2]>0&&p[3]>0) {
    var merk=B[p[2]];
    B[p[2]]=D[p[3]];
    D[p[3]]=merk;
    //alert("B=["+B+"]; D=["+D+"];");
    tausche(p[2],p[3]);
    p=suche_Pivot();
    LCode=LCode+"\n\nZwischenergebnis und weitere Pivotsuche:\n\n[ ["+Ausgabe_Logfile(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
    if (p[2]>0&&p[3]>0)
      HCode=HCode+"<p>Zwischenergebnis und Ergebnis der nächsten Pivotsuche:<p>";
      else HCode=HCode+"<p>letztes Ergebnis (kein Pivot mehr gefunden):<p>";
    HCode=HCode+Ausgabe_HCode(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
    }
  LCode=LCode+"\n\nErgebnis:\n\n[ ["+Ausgabe_Logfile(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
  document.getElementById("Logfile").firstChild.nodeValue=LCode;
  document.getElementById("HCode").innerHTML=HCode;
  }

function Zusatz(i,j) {
  var merk=B[i];
  B[i]=D[j];
  D[j]=merk;
  tausche(i,j);
  p=suche_Pivot();
  LCode=LCode+"\n\nZusatzschritt:\n\n[ ["+Ausgabe_Logfile(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
  HCode=HCode+"<p>Zusatzschritt:<p>";
  HCode=HCode+Ausgabe_HCode(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p);
  document.getElementById("Logfile").firstChild.nodeValue=LCode;
  document.getElementById("HCode").innerHTML=HCode;
  }

function Ausgabe_Logfile(Ausgangsmatrix,gemeinsamer_Nenner,B,D,p) {
  var T=Ausgangsmatrix.join("],\n  [")+"] ] / "
    +gemeinsamer_Nenner+"\n\nB=["+B+"]; D=["+D+"];"
    +"\n\nr="+p[0]+"; s="+p[1]+"; ri="+p[2]+"; sj="+p[3]+";\n";
