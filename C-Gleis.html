function Gerade(Bild,Laenge) {
  S.lfdnr=lfdnr; lfdnr=lfdnr+1;
  S.fun=['Gerade',Bild,Laenge,0,0];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  let dx=Math.cos(S.phi/180*Math.PI)*Laenge*scale;
  let dy=Math.sin(S.phi/180*Math.PI)*Laenge*scale;
  let dxi=Distanz(dx);
  let dyi=Distanz(dy);
  if (dx<0) S.dmlx[dxi]=S.dmlx[dxi]-1; else S.dmlx[dxi]=S.dmlx[dxi]+1;
  if (dy<0) S.dmly[dyi]=S.dmly[dyi]-1; else S.dmly[dyi]=S.dmly[dyi]+1;
  Distanzsumme(S.dmlx);
  Distanzsumme(S.dmly);
  S.x=S.x+dx;
  S.y=S.y+dy;
  }

function Kurve(Bild,Radius,Winkel,rl) {
  S.lfdnr=lfdnr; lfdnr=lfdnr+1;
  S.fun=['Kurve',Bild,Radius,Winkel,rl];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  let phi2=(S.phi+90*rl)/180*Math.PI;
  let phi3=(S.phi+90*rl+Winkel*rl)/180*Math.PI;
  let dx=-Math.cos(phi3)*Radius*scale+Math.cos(phi2)*Radius*scale;
  let dy=-Math.sin(phi3)*Radius*scale+Math.sin(phi2)*Radius*scale;
  let dxi=Distanz(dx);
  let dyi=Distanz(dy);
  if (dx<0) S.dmlx[dxi]=S.dmlx[dxi]-1; else S.dmlx[dxi]=S.dmlx[dxi]+1;
  if (dy<0) S.dmly[dyi]=S.dmly[dyi]-1; else S.dmly[dyi]=S.dmly[dyi]+1;
  Distanzsumme(S.dmlx);
  Distanzsumme(S.dmly);
  S.x=S.x+dx;
  S.y=S.y+dy;
  if (rl==1) Kurvenliste_r.push('r'+S.phi); else Kurvenliste_l.push('l'+S.phi); 
  S.phi=(S.phi+Winkel*rl+360)%360;
  }

function m188m172such(d) {

function Distanz(d) {
  let da=Math.abs(d);
  let i0=-1;
  for (let i=0;i<Distanzmerkliste.length;i++) if (Math.abs(Distanzmerkliste[i]-da)<0.01) i0=i;
  if (i0==-1) {i0=Distanzmerkliste.length; Distanzmerkliste.push(da)}
  return i0;
  }

function Distanzsumme(dl) {
  while (dl[7]>1) {dl[7]=dl[7]-2; dl[2]=dl[2]+1};
  while (dl[7]<-1) {dl[7]=dl[7]+2; dl[2]=dl[2]-1};
  while (dl[9]>1) {dl[9]=dl[9]-2; dl[3]=dl[3]+1};
  while (dl[9]<-1) {dl[9]=dl[9]+2; dl[3]=dl[3]-1};
  while (dl[2]>0&&dl[3]>0) {dl[2]=dl[2]-1; dl[3]=dl[3]-1; dl[1]=dl[1]+2}
  while (dl[2]<0&&dl[3]<0) {dl[2]=dl[2]+1; dl[3]=dl[3]+1; dl[1]=dl[1]-2}
  while (dl[4]>0&&dl[5]>0) {dl[4]=dl[4]-1; dl[5]=dl[5]-1; dl[1]=dl[1]+1}
  while (dl[4]<0&&dl[5]<0) {dl[4]=dl[4]+1; dl[5]=dl[5]+1; dl[1]=dl[1]-1}
  while (dl[7]>0&&dl[9]>0) {dl[7]=dl[7]-1; dl[9]=dl[9]-1; dl[1]=dl[1]+1}
  while (dl[7]<0&&dl[9]<0) {dl[7]=dl[7]+1; dl[9]=dl[9]+1; dl[1]=dl[1]-1}
  }
