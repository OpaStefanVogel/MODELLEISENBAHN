function Logvar(id) {
  let text='';
  text=text+'R='+R+'<br/>m077='+m077+'<br/>m094='+m094+'<br/>m172='+m172+'<br/>m188='+m188+'<br/>m077+3*m094='+(m077+3*m094);
  text=text+'<br/>S='+JSON.stringify(S);
  text=text+'<br/>Schienen='+JSON.stringify(Schienen);
  text=text+'<br/>Restschienen='+JSON.stringify(Restschienen);
  id.innerHTML=text;
  }

function Gerade(Laenge,Bild) {
  Logvar(L1);
  S.fun=['Gerade',Laenge,Bild,0,0];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  S.x=S.x+Math.cos(S.phi/180*Math.PI)*Laenge*scale;
  S.y=S.y+Math.sin(S.phi/180*Math.PI)*Laenge*scale;
  Logvar(L2);
  }

function Kurve(Radius,Winkel,rl,Bild) {
  Logvar(L1);
  S.fun=['Kurve',Radius,Winkel,rl,Bild];
  S.Bild=Bild;
  Schienen.push(structuredClone(S));
  let phi2=(S.phi+90*rl)/180*Math.PI;
  let phi3=(S.phi+90*rl+Winkel*rl)/180*Math.PI;
  S.x=S.x-Math.cos(phi3)*Radius*scale+Math.cos(phi2)*Radius*scale;
  S.y=S.y-Math.sin(phi3)*Radius*scale+Math.sin(phi2)*Radius*scale;
  S.phi=(S.phi+Winkel*rl+360)%360;
  Logvar(L2);
  }


function Schliessen() {
  let S2=[S.x,S.y,S.phi];
  Restschienen=Schienen;
  Schienen=[];
  while (S.phi!=180) Kurve(R,30,r,"#k130r");
  for (let i=0;i<Restschienen.length;i++) {
    let Q=Restschienen[i].fun;
    if (Q[0]=='Gerade') Gerade(Q[1],Q[2],Q[3],Q[4]); else Kurve(Q[1],Q[2],Q[3],Q[4]);
    }
  while (S.phi!=0) Kurve(R,30,r,"#k130r");
  let tz=Restschienen;
  Restschienen=Schienen;
  Schienen=tz;
  S.x=S2[0];S.y=S2[1];S.phi=S2[2];
  Abkuerzen();
  }


let st='';
function Schienenplot() {
  st=st0;
  for (let i=0;i<Schienen.length;i++) {
    let S=Schienen[i];
    st=st+'<use id="Schiene'+i+'" href="'+S.Bild+'" transform="translate('+S.x+','+S.y+') rotate('+S.phi+') scale('+scale+')" fill="green"/>\n  ';
    }
  for (let i=0;i<Restschienen.length;i++) {
    let S=Restschienen[i];
    st=st+'<use id="Schiene'+i+'" href="'+S.Bild+'" transform="translate('+S.x+','+S.y+') rotate('+S.phi+') scale('+scale+')" fill="red"/>\n  ';
    }
  st=st+'<use id="Schienenlegezug1" href="#Schienenlegezug" transform="translate('+S.x+','+S.y+') rotate('+S.phi+')"/>\n  ';

  st=st+'</svg>';
  L3.innerText=st;
  SV.innerHTML=st;
  }

      alert(S.Bild+' '+S.phi+' i='+i+' j='+j+' RET='+RET);
      }*/
    }
